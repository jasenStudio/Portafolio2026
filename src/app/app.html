<div class="drawer">
  <input #drawerChk id="nav-drawer" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content flex flex-col min-h-screen">
    <nav-bar class="fixed top-0 left-0 right-0 z-50" />
    <main class="flex-1">
      <router-outlet />
    </main>
    <app-footer />
  </div>
  <nav-drawer (close)="closeDrawer()" />
</div>
