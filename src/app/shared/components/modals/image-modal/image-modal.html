<dialog #dialog class="modal" (close)="onClose()">
  <div class="modal-box max-w-3xl p-0 bg-base-100">
    <form method="dialog">
      <button
        type="submit"
        class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2 z-10"
        aria-label="close"
      >
        ✕
      </button>
    </form>
    @if (data(); as data) {
      <img
        [src]="data.images[activeIndex()]"
        [alt]="data.title"
        class="w-full max-h-[70vh] object-contain"
      />
      @if (data.images.length > 1) {
        <div class="flex items-center justify-center gap-4 p-4">
          <button
            type="button"
            class="btn btn-primary btn-circle btn-md shadow-lg hover:shadow-xl hover:scale-105 transition-all text-xl"
            (click)="prevImage()"
            aria-label="previous"
          >
            ‹
          </button>
          <span class="font-mono text-sm font-semibold">{{ activeIndex() + 1 }} / {{ data.images.length }}</span>
          <button
            type="button"
            class="btn btn-primary btn-circle btn-md shadow-lg hover:shadow-xl hover:scale-105 transition-all text-xl"
            (click)="nextImage()"
            aria-label="next"
          >
            ›
          </button>
        </div>
      }
    }
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
