<dialog #dialog class="modal" (close)="onClose()">
  <div class="modal-box max-w-3xl p-0 bg-base-100">
    <form method="dialog">
      <button
        type="submit"
        class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2 z-10"
        aria-label="close"
      >
        ✕
      </button>
    </form>
    @if (data(); as data) {
      <swiper-container
        #swiperContainer
        class="w-full"
        slides-per-view="1"
        zoom="true"
        zoom-max-ratio="3"
        [initial-slide]="activeIndex()"
        (swiperslidechange)="onSlideChange($event)"
      >
        @for (img of data.images; track $index) {
          <swiper-slide>
            <div class="swiper-zoom-container">
              <img [src]="img" [alt]="data.title" class="zoom-image" />
            </div>
          </swiper-slide>
        }
      </swiper-container>
      @if (data.images.length > 1) {
        <div class="flex items-center justify-center gap-4 p-4">
          <button
            type="button"
            class="btn btn-primary btn-circle btn-md shadow-lg hover:shadow-xl hover:scale-105 transition-all text-xl"
            (click)="prevImage()"
            aria-label="previous"
          >
            ‹
          </button>
          <span class="font-mono text-sm font-semibold">{{ activeIndex() + 1 }} / {{ data.images.length }}</span>
          <button
            type="button"
            class="btn btn-primary btn-circle btn-md shadow-lg hover:shadow-xl hover:scale-105 transition-all text-xl"
            (click)="nextImage()"
            aria-label="next"
          >
            ›
          </button>
        </div>
      }
    }
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
