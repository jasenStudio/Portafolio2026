<div
  animateOnViewport
  id="projects"
  class="bg-light relative h-full mx-auto px-8 sm:px-12 md:px-24 flex flex-col justify-center py-16 sm:py-20"
>
  <div>
    <div class="mt-6 sm:mt-8 md:mt-10 grid grid-cols-1 md:grid-cols-12 gap-8 md:gap-12">
      <div class="md:col-span-12 lg:col-span-4">
        <h2
          class="text-base-content text-pretty text-xl sm:text-2xl md:text-6xl lg:text-7xl font-bold tracking-tight animate-on-viewport"
        >
          {{ t().projects.title }}
        </h2>
        <hr class="h-1 mt-2 w-20 bg-base-content animate-on-viewport animation-delay-200" />
      </div>
      <div class="md:col-span-12 lg:col-span-8">
        <div class="flex flex-col gap-8 mx-2 sm:mx-4 lg:mx-0">
          @for (project of projects(); track project.id) {
            <a
              [href]="project.href"
              class="block relative p-4 sm:p-6 md:p-8 rounded-xl sm:rounded-2xl border border-base-300 bg-base-100 transition-all duration-300 hover:bg-base-200/50 hover:shadow-xl hover:border-base-content/30 hover:-translate-y-1"
            >
              <project-card
                [id]="project.id"
                [title]="project.title"
                [description]="project.description"
                [badges]="project.badges"
                [href]="project.href"
              />
            </a>
          }
        </div>
      </div>
    </div>
  </div>
</div>
