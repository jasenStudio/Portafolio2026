<div class="space-y-4">
  <div>
    <span class="text-primary text-sm font-mono"> {{ id() }} </span>

    @if (hasExternalLink()) {
      <a [href]="href()" target="_blank" rel="noopener noreferrer" class="flex justify-between items-start group">
        <h3 class="text-xl sm:text-2xl font-bold text-base-content hover:underline underline-offset-2">{{ title() }}</h3>
        <div
          class="w-10 h-10 sm:w-11 sm:h-11 md:w-12 md:h-12 flex items-center justify-center bg-base-content rounded-full text-base-100 transition-all duration-300 group-hover:bg-base-content/80"
        >
          <svg
            class="w-4 h-4 sm:w-4.5 sm:h-4.5 md:w-5 md:h-5 transition-transform duration-300 group-hover:translate-x-0.5 group-hover:-translate-y-0.5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M7 17L17 7M17 7H7M17 7V17"
            ></path>
          </svg>
        </div>
      </a>
    } @else {
      <h3 class="text-xl sm:text-2xl font-bold text-base-content mt-1">{{ title() }}</h3>
    }
  </div>

  <p class="text-base sm:text-lg text-base-content/75 leading-relaxed pr-12 sm:pr-14 md:pr-16">
    {{ description() }}
  </p>

  <div class="flex flex-wrap gap-1.5 sm:gap-2 pt-2">
    @for (tech of techs(); track tech.id) {
      <app-tech-badge [tech]="tech" />
    }
  </div>
</div>
