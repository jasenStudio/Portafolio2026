<div class="flex flex-col relative min-h-screen mx-auto pt-16">
  <div class="absolute inset-0 z-0">
    <hero-canvas />
  </div>

  <div
    class="absolute inset-0 z-0 from-base-100/90 via-base-100/70 to-base-100/40 pointer-events-none"
  ></div>

  <div
    class="relative z-10 flex-1 flex flex-col justify-center px-4 sm:px-12 md:px-24 py-4 md:py-0"
  >
    <div>
      <h2
        class="text-base-content text-pretty text-xl sm:text-2xl md:text-5xl font-bold tracking-tight animate-fade-in"
      >
        {{ t().hero.greeting }}
      </h2>
      <h1
        class="mt-4 sm:mt-6 md:mt-8 text-pretty text-3xl sm:text-4xl md:text-6xl lg:text-8xl font-bold tracking-tight text-secondary-300 animate-fade-in animation-delay-200"
      >
        {{ t().hero.intro }} <span class="text-primary">{{ t().hero.name }}</span>
      </h1>
      <p
        class="text-base-content mt-3 sm:mt-5 md:mt-6 text-pretty text-base sm:text-lg md:text-xl/8 font-medium animate-fade-in animation-delay-400"
      >
        {{ t().hero.role }}
      </p>
    </div>
  </div>

  <app-social-media
    [divClass]="
      'relative z-10 px-4 sm:px-12 md:px-24 py-4 sm:py-6 md:py-8 md:pb-16 flex gap-x-4 sm:gap-x-6 md:gap-x-8 text-base-content/70 animate-fade-in animation-delay-600'
    "
  />

  <div
    class="absolute z-20 top-32 right-4 sm:right-8 md:right-12 flex flex-col items-center gap-1.5 pointer-events-auto"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="text-base-content/40"
    >
      <path d="M12 3v18" />
      <path d="m18 9-6-6-6 6" />
      <path d="m18 15-6 6-6-6" />
    </svg>
    <input
      type="range"
      min="-20"
      max="20"
      step="1"
      [value]="state.gravityY()"
      (input)="state.setGravityY($any($event.target).valueAsNumber)"
      class="[writing-mode:vertical-lr] [direction:rtl] h-28 md:h-36"
      style="accent-color: var(--color-primary)"
    />
  </div>
</div>
