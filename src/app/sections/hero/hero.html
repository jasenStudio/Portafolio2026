<div class="relative h-full mx-auto overflow-hidden pt-16">
  <div class="absolute inset-0 z-0">
    <hero-canvas />
  </div>

  <div
    class="absolute inset-0 z-0 bg-gradient-to-r from-base-100/90 via-base-100/70 to-base-100/40 pointer-events-none"
  ></div>

  <div
    class="relative z-10 h-full flex flex-col justify-center px-8 sm:px-12 md:px-24 py-8 md:py-0"
  >
    <div>
        <h2
          class="text-base-content text-pretty text-xl sm:text-2xl md:text-5xl font-bold tracking-tight animate-fade-in"
        >
          {{ t().hero.greeting }}
        </h2>
        <h1
          class="mt-6 sm:mt-8 md:mt-10 text-pretty text-4xl sm:text-5xl md:text-6xl lg:text-8xl font-bold tracking-tight text-secondary-300 animate-fade-in animation-delay-200"
        >
          {{ t().hero.intro }} <span class="text-primary">{{ t().hero.name }}</span>
        </h1>
        <p
          class="text-base-content mt-4 sm:mt-6 md:mt-8 text-pretty text-base sm:text-lg md:text-xl/8 font-medium animate-fade-in animation-delay-400"
        >
          {{ t().hero.role }}
        </p>
    </div>
  </div>

  <div
    class="absolute z-10 bottom-0 left-0 right-0 px-8 sm:px-12 md:px-24 py-6 sm:py-8 md:py-10 flex gap-x-4 sm:gap-x-6 md:gap-x-8 text-base-content/70 animate-fade-in animation-delay-600"
  >
    <a
      href="mailto:jsalgadoecheverria@gmail.com"
      aria-label="Email"
      class="transition-colors duration-300 hover:text-accent"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-6 w-6 sm:h-7 sm:w-7 md:h-8 md:w-8"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
        <path
          d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10z"
        ></path>
        <path d="M3 7l9 6l9 -6"></path>
      </svg>
    </a>
    <a
      href="https://www.linkedin.com/in/jasalgadoecheverria"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="LinkedIn"
      class="transition-colors duration-300 hover:text-accent"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-6 w-6 sm:h-7 sm:w-7 md:h-8 md:w-8"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
        <path d="M8 11v5"></path>
        <path d="M8 8v.01"></path>
        <path d="M12 16v-5"></path>
        <path d="M16 16v-3a2 2 0 1 0 -4 0"></path>
        <path
          d="M3 7a4 4 0 0 1 4 -4h10a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-10a4 4 0 0 1 -4 -4z"
        ></path>
      </svg>
    </a>

    <a
      href="https://github.com/jasenStudio"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub"
      class="transition-colors duration-300 hover:text-accent"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="h-6 w-6 sm:h-7 sm:w-7 md:h-8 md:w-8"
      >
        <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
        <path
          d="M9 19c-4.3 1.4 -4.3 -2.5 -6 -3m12 5v-3.5c0 -1 .1 -1.4 -.5 -2c2.8 -.3 5.5 -1.4 5.5 -6a4.6 4.6 0 0 0 -1.3 -3.2a4.2 4.2 0 0 0 -.1 -3.2s-1.1 -.3 -3.5 1.3a12.3 12.3 0 0 0 -6.2 0c-2.4 -1.6 -3.5 -1.3 -3.5 -1.3a4.2 4.2 0 0 0 -.1 3.2a4.6 4.6 0 0 0 -1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6 .6 -.6 1.2 -.5 2v3.5"
        ></path>
      </svg>
    </a>
  </div>

  <div
    class="absolute z-20 top-32 right-4 sm:right-8 md:right-12 flex flex-col items-center gap-1.5 pointer-events-auto"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="text-base-content/40"
    >
      <path d="M12 3v18" />
      <path d="m18 9-6-6-6 6" />
      <path d="m18 15-6 6-6-6" />
    </svg>
    <input
      type="range"
      min="-20"
      max="20"
      step="1"
      [value]="state.gravityY()"
      (input)="state.setGravityY($any($event.target).valueAsNumber)"
      class="[writing-mode:vertical-lr] [direction:rtl] h-28 md:h-36"
      style="accent-color: var(--color-primary)"
    />
  </div>
</div>
