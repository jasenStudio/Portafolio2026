<div class="flex flex-col relative min-h-screen mx-auto px-8 sm:px-12 md:px-20 py-20">
  <form class="flex flex-wrap gap-x-6 gap-y-4 mb-8 lg:ps-10">
    <label class="input">
      <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <g
          stroke-linejoin="round"
          stroke-linecap="round"
          stroke-width="2.5"
          fill="none"
          stroke="currentColor"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </g>
      </svg>
      <input type="search" class="grow" placeholder="Search" [formField]="filterForm.search" />
    </label>

    <select class="select select-base-content" [formField]="filterForm.technology">
      <option value="">Todas las tecnologías</option>
      @for (group of groupedTechnologies(); track group.type) {
        <optgroup [label]="group.type">
          @for (t of group.items; track t.id) {
            <option [value]="t.id">{{ t.name }}</option>
          }
        </optgroup>
      }
    </select>
  </form>

  <div class="grid grid-cols-12 gap-6">
    @for (project of filteredProjects(); track project.id) {
      <div class="col-span-12 sm:col-span-6 lg:col-span-4">
        <project-gallery-card
          [id]="project.id"
          [title]="project.title"
          [description]="project.description"
          [badges]="project.technologyIds"
          [href]="project.href"
          [slug]="project.slug"
          [images]="project.images"
        />
      </div>
    }
  </div>

  <image-modal />
  <description-modal />
</div>
